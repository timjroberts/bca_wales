name: Deploy site preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NEXT_PUBLIC_SITE_ORIGIN: https://preview.bca.wales
          NEXT_PUBLIC_RELEASE_MANIFEST_URL: https://assets-preview.bca.wales/releases/current.json
          NEXT_PUBLIC_ASSET_ORIGIN: https://assets-preview.bca.wales
      - name: Deploy immutable branch preview
        if: github.event.pull_request.head.repo.fork == false
        run: npx wrangler pages deploy apps/web/out --project-name bca-wales-explorer-preview --branch "pr-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
