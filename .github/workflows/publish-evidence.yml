name: Publish evidence release

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Stage evidence release workflow run
        required: true
        type: string
      release_id:
        description: Staged immutable release identifier
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the staged final release manifest
        required: true
        type: string
      mode:
        description: Promotion mode
        required: true
        default: manual
        type: choice
        options: [manual, automatic]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-evidence-pointer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      PROMOTION_MODE: ${{ inputs.mode }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate immutable inputs
        run: node -e 'const assert=require("node:assert/strict"); assert.match(process.env.RELEASE_ID, /^release-[a-z0-9][a-z0-9._-]+$/); assert.match(process.env.MANIFEST_SHA256, /^[0-9a-f]{64}$/); assert.match(process.env.STAGING_RUN_ID, /^[1-9][0-9]*$/);'
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      - name: Download the exact staged release
        uses: actions/download-artifact@v4
        with:
          name: staged-evidence-${{ inputs.release_id }}
          path: staged-release/${{ inputs.release_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.staging_run_id }}
      - name: Verify the staged final manifest
        run: echo "$MANIFEST_SHA256  staged-release/$RELEASE_ID/manifests/release.json" | sha256sum --check --strict
      - name: Atomically promote the already staged release
        run: npm run geodata -- publish --release-root "staged-release/$RELEASE_ID" --bucket bca-wales-public-releases --jurisdiction eu --identity timjroberts --mode "$PROMOTION_MODE"
      - name: Verify production after promotion
        run: npm run check:production
      - name: Retain release audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ inputs.release_id }}
          path: |
            staged-release/${{ inputs.release_id }}/manifests/
            staged-release/${{ inputs.release_id }}/reports/
          if-no-files-found: error
          retention-days: 90
