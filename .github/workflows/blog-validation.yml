name: Validate blog Worker
on:
  pull_request:
    paths: ['apps/blog/**', 'package*.json', '.github/workflows/blog-validation.yml', '.github/workflows/monitor-blog.yml']
  push:
    branches: [main]
    paths: ['apps/blog/**', 'package*.json', '.github/workflows/blog-validation.yml', '.github/workflows/monitor-blog.yml']
permissions:
  contents: read
jobs:
  blog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:blog
      - run: npx playwright install --with-deps chromium
        working-directory: apps/blog
      - run: npm run test:browser --workspace @bca/blog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-local-browser-acceptance
          path: /tmp/bca-blog-*.png
          if-no-files-found: ignore
          retention-days: 7
