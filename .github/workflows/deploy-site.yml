name: Deploy production site

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Evidence release paired with this site deployment
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the immutable evidence manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NEXT_PUBLIC_SITE_ORIGIN: https://explore.bca.wales
          NEXT_PUBLIC_RELEASE_MANIFEST_URL: https://assets.bca.wales/releases/current.json
          NEXT_PUBLIC_ASSET_ORIGIN: https://assets.bca.wales
      - name: Stage the retired-route guard
        run: npm run stage:pages-worker
      - name: Deploy the application only
        run: npx wrangler pages deploy apps/web/out --project-name bca-wales-explorer --branch main --commit-hash "${{ github.sha }}" --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_PRODUCTION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the deployed site and staged evidence release
        run: npm run check:production
        env:
          BCA_VERIFICATION_MODE: staged
          BCA_EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          BCA_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      - name: Record deployment pairing
        run: node tooling/checks/write-deployment-record.mjs "${{ github.sha }}" "${{ inputs.release_id }}" "${{ inputs.manifest_sha256 }}" > launch-acceptance-candidate.json
      - run: node tooling/checks/validate-launch-record.mjs launch-acceptance-candidate.json
      - name: Retain launch acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: launch-acceptance-${{ github.sha }}
          path: launch-acceptance-candidate.json
          if-no-files-found: error
          retention-days: 90
