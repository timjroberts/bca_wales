name: Monitor blog staging

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-staging-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check scheduled maintenance and backup freshness
        run: node apps/blog/tooling/monitor.mjs
        env:
          BLOG_HEALTH_URL: https://bca-wales-blog-staging.tim-f78.workers.dev/api/ops/health
          BLOG_MONITOR_TOKEN: ${{ secrets.BLOG_STAGING_MONITOR_TOKEN }}
